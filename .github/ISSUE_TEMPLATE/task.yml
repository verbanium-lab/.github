name: Task
description: One task = one branch = one pull request. An agent may pick it up by default.
title: "<Verb + what to do>"
labels: ["agent"]
projects: ["verbanium-lab/2"]
body:
  - type: markdown
    attributes:
      value: |
        Keep it short and verifiable. If a person must do the work (consoles, keys, payments, a decision),
        replace the `agent` label with `owner` after creating the issue. Agents do not take size L: split it.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Why this is needed, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What exactly to change. A short list.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: An observable result — something to open, run or see.
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: How to verify
      description: A command, a link or steps.
    validations:
      required: true
  - type: dropdown
    id: product
    attributes:
      label: Product
      options: [iblonda, tower, verbanium, platform]
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: "S — up to 2 hours, M — up to a day, L — more than a day (split it)."
      options: [S, M, L]
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      description: "high — secrets, access, money, user data, workflows, infrastructure, major versions."
      options: [low, high]
    validations:
      required: true
  - type: textarea
    id: depends
    attributes:
      label: Depends on
      description: "Issue links: #12 or verbanium-lab/verbanium#3. Empty if none."
