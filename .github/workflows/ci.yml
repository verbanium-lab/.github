name: Validate organization defaults

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out public repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - name: Install pinned parser
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/scripts/requirements.txt
      - name: Install verified lint and secret tools
        run: |
          bash .github/scripts/install-tool.sh actionlint "$RUNNER_TEMP/defaults-bin"
          bash .github/scripts/install-tool.sh zizmor "$RUNNER_TEMP/defaults-bin"
          bash .github/scripts/install-tool.sh gitleaks "$RUNNER_TEMP/defaults-bin"
          echo "$RUNNER_TEMP/defaults-bin" >> "$GITHUB_PATH"
      - name: Validate public defaults and rejection fixtures
        run: bash .github/scripts/check.sh
