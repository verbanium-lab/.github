# Merges the caller repository's open release-please Release PR once its required `ci` check has
# passed on the PR head (owner decision 2026-11-01: the Release PR is a technical registration of a
# release; the owner reviews code in the feature PRs, so the Release PR must not block releases).
#
# Safety boundary — the PR is merged only when ALL hold, otherwise it is left for the owner:
#   - event is a push to main, or a workflow_run of the caller's CI (which GitHub runs on main);
#   - head branch `release-please--branches--main` in the same repository, base `main`, not draft;
#   - author is the verbanium-ci App (`verbanium-ci[bot]`);
#   - every changed file is release metadata: `.release-please-manifest.json`, `CHANGELOG.md`,
#     `package.json`, `package-lock.json`, `version.txt`; in the JSON files every changed line is a
#     `"version"` field (manifest: a `"<path>": "<semver>"` entry). Anything else → skip;
#   - the required `ci` check run from GitHub Actions (app 15368) on exactly that head SHA is
#     completed with success (read with the job token, `checks: read`). Pending → wait for the CI
#     workflow_run trigger; failed → skip.
# The merge is a direct squash merge by the verbanium-ci App through the REST merge endpoint with
# `sha=<checked head>`. GitHub auto-merge is not used: it does not apply the App's ruleset bypass
# (verbanium-templates#79 stayed BLOCKED with auto-merge on). The org ruleset `main` lets the
# verbanium-ci App bypass the approval rule for PR merges only (infra github/repositories.json);
# the `ci-required` ruleset has no bypass, so GitHub still refuses a merge without a green `ci`.
#
# Release mode (input `release-mode`, owner decision 2026-11-27, infra#412): when the merge happens.
#   always      (default; today's behaviour) merge whenever the checks above pass;
#   on-request  merge only if any pull request merged into main since the last merged Release PR
#               has the line `- [x] Release and deploy to release-candidate after merge` ticked in
#               its description and its merge commit is contained in the Release PR head (a later
#               unticked merge does not cancel the request: a release ships everything on main);
#               otherwise the Release PR waits for the owner;
#   never       do nothing; the owner merges every Release PR.
# The description is read through the API as data and only matched by a regular expression in
# Python; it never reaches a shell or an expression. All checks above still apply to every mode.
#
# Callers (both pinned by commit):
#   release.yml, after the release-please job (runs on the push to main that updates the PR):
#     release-pr-merge:
#       needs: release-please
#       permissions:
#         checks: read
#       uses: verbanium-lab/.github/.github/workflows/release-pr-merge.yml@REVIEWED_WORKFLOW_COMMIT
#       secrets:
#         VERBANIUM_CI_PRIVATE_KEY: ${{ secrets.VERBANIUM_CI_PRIVATE_KEY }}
#       with:
#         client-id: ${{ vars.VERBANIUM_CI_CLIENT_ID }}
#   release-pr-merge.yml, triggered when CI finishes on the Release PR branch — see
#   docs/reusable-workflows.md#release-pr-merge.

name: Release PR merge

on:
  workflow_call:
    inputs:
      client-id:
        description: verbanium-ci App client ID (vars.VERBANIUM_CI_CLIENT_ID of the caller)
        required: true
        type: string
      runs-on:
        description: Runner label for every job, e.g. vars.CI_RUNS_ON
        default: ubuntu-24.04
        type: string
      release-mode:
        description: >-
          When to merge the Release PR: always (the default), on-request (only if a merged pull
          request in it ticked the release checkbox) or never
        default: always
        type: string
    secrets:
      VERBANIUM_CI_PRIVATE_KEY:
        description: verbanium-ci App private key (organization secret)
        required: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  merge:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    # Only to read the `ci` check runs of the Release PR head; the merge uses the App token.
    permissions:
      checks: read
    # The verbanium-ci key is used on main only, behind the production environment's branch rule.
    environment:
      name: production
      deployment: false
    steps:
      - name: Check event boundary
        id: plan
        env:
          CLIENT_ID: ${{ inputs.client-id }}
          RELEASE_MODE: ${{ inputs.release-mode }}
        run: |
          [[ ("$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_run) && "$GITHUB_REF" == refs/heads/main ]] \
            || { echo "::error::release PR merge runs on pushes to main or CI workflow_run only"; exit 1; }
          [[ "$CLIENT_ID" =~ ^Iv[0-9A-Za-z.]{10,40}$ ]] || { echo "::error::invalid client-id"; exit 1; }
          [[ "$RELEASE_MODE" =~ ^(always|on-request|never)$ ]] \
            || { echo "::error::release-mode must be always, on-request or never"; exit 1; }
          [[ "$RELEASE_MODE" != never ]] || echo "Release PR merge is off for this repository (release-mode: never)." >> "$GITHUB_STEP_SUMMARY"
          echo "client-id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "release-mode=$RELEASE_MODE" >> "$GITHUB_OUTPUT"
      - name: Mint verbanium-ci token
        id: app
        if: ${{ steps.plan.outputs.release-mode != 'never' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.plan.outputs.client-id }}
          private-key: ${{ secrets.VERBANIUM_CI_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check the Release PR and merge it
        if: ${{ steps.plan.outputs.release-mode != 'never' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CHECKS_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ steps.plan.outputs.release-mode }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          # Decision logic of the on-request mode: pure functions, no I/O (tested and dry-run alone).
          # The line below is the one shared with the pull request template (ticked form).
          CHECKBOX = "- [x] Release and deploy to release-candidate after merge"
          LABEL = CHECKBOX[len("- [x] "):]
          TICKED = re.compile(r"^ {0,3}[-*]\s+\[[xX]\]\s+" + re.escape(LABEL) + r"\s*$")
          COMMENT = re.compile(r"<!--.*?(?:-->|\Z)", re.DOTALL)
          FENCE = re.compile(r"^ {0,3}(`{3,}|~{3,})(.*)$")

          def ticked(body):
              """True when the description has the ticked box on a line of its own, outside comments and code."""
              if not isinstance(body, str):
                  return False
              fence = ""
              # Only CRLF, CR and LF end a line here; str.splitlines also splits on U+2028, form feed and more.
              for line in re.split(r"\r\n|\r|\n", COMMENT.sub("", body)):
                  opening = FENCE.match(line)
                  if opening and opening[1][0] == "`" and "`" in opening[2]:
                      opening = None  # a code span on one line, not a fence
                  if fence:
                      if opening and opening[1][0] == fence[0] and len(opening[1]) >= len(fence) and not opening[2].strip():
                          fence = ""
                  elif opening:
                      fence = opening[1]
                  elif TICKED.match(line):
                      return True
              return False

          CLOSED_PAGE = 50  # the one page of closed pull requests that is read, newest update first

          def release_request(closed, repo, release_ref, contained):
              """(requested, reason) from the closed pull requests into main, in any order.

              Only pull requests merged after the last merged Release PR can be in the open one. Any
              of them with the box ticked asks for the release, provided its merge commit is in the
              Release PR head; the newest ticked one is checked first and the first contained one is
              named. A later pull request without the box does not cancel the request.

              A full page may have dropped pull requests, so it decides only when it provably reaches
              back past the last release: its oldest `updated_at` is earlier than `since`. A fresh
              pull request has updated_at >= merged_at > since, so then every one of them is on the
              page (and so is the newest Release PR). Otherwise, or with no merged Release PR at all
              (`since` is empty), the window is incomplete: no request (fail closed).
              """
              merged = [p for p in closed if p.get("merged_at") and (p.get("base") or {}).get("ref") == "main"]
              def release_pr(p):
                  head = p.get("head") or {}
                  return head.get("ref") == release_ref and (head.get("repo") or {}).get("full_name") == repo
              releases = [p["merged_at"] for p in merged if release_pr(p)]
              since = max(releases, default="")
              fresh = [p for p in merged if not release_pr(p) and p["merged_at"] > since]
              if len(closed) >= CLOSED_PAGE:
                  oldest = min((p.get("updated_at") or "" for p in closed), default="")  # missing: "" never passes
                  if not oldest or oldest >= since:
                      return False, (f"the page of {CLOSED_PAGE} closed pull requests is full and does not reach back "
                                     "past the last release, so the last release or older pull requests may be "
                                     "missing and the window is incomplete")
              if not fresh:
                  return False, "no pull request merged into main since the last release"
              asked = sorted((p for p in fresh if ticked(p.get("body"))),
                             key=lambda p: (p["merged_at"], p.get("number") or 0), reverse=True)
              if not asked:
                  return False, "none of the pull requests merged since the last release has the release box ticked"
              for p in asked:
                  sha = p.get("merge_commit_sha")
                  if re.fullmatch(r"[0-9a-f]{40}", sha or "") and contained(sha):
                      return True, f"pull request #{p.get('number')} asked for the release"
              numbers = ", ".join(f"#{p.get('number')}" for p in asked)
              return False, f"the pull requests that ticked the release box ({numbers}) are not in the Release PR head yet"

          # --- end of the decision logic ---
          repo = os.environ["GITHUB_REPOSITORY"]
          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          HEAD = "release-please--branches--main"
          AUTHOR = "verbanium-ci[bot]"
          REQUIRED_CHECK = "ci"
          ACTIONS_APP_ID = 15368  # GitHub Actions; the integration the ci-required ruleset trusts
          META = re.compile(r"^(?:.+/)?(?:CHANGELOG\.md|package\.json|package-lock\.json|version\.txt)$|^\.release-please-manifest\.json$")
          VERSION_LINE = re.compile(r'^[+-]\s*"version":\s*"[0-9A-Za-z.+-]+",?\s*$')
          MANIFEST_LINE = re.compile(r'^[+-]\s*"[A-Za-z0-9._/-]+":\s*"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?",?\s*$')
          TEXT_LINE = re.compile(r"^[+-]\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?\s*$")

          def pages(path, token=None):
              env = dict(os.environ, GH_TOKEN=token) if token else None
              out = subprocess.run(["gh", "api", "--paginate", "--slurp", path],
                                   capture_output=True, text=True, check=True, env=env).stdout
              return json.loads(out)

          def api(path):
              return [item for page in pages(path) for item in page]

          def say(message):
              print(message)
              summary.write(message + "\n")

          prs = api(f"repos/{repo}/pulls?state=open&base=main&head={owner}:{HEAD}&per_page=100")
          if not prs:
              say("No open Release PR — nothing to merge.")
              sys.exit(0)
          if len(prs) != 1:
              say(f"::warning::{len(prs)} open Release PRs — left for the owner.")
              sys.exit(0)
          pr = prs[0]
          number, sha = pr["number"], pr["head"]["sha"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha or ""):
              say(f"::warning::Release PR #{number}: unexpected head SHA — left for the owner.")
              sys.exit(0)
          reasons = []
          if pr["user"]["login"] != AUTHOR or pr["user"]["type"] != "Bot":
              reasons.append(f"author {pr['user']['login']} is not {AUTHOR}")
          if pr["head"]["repo"] is None or pr["head"]["repo"]["full_name"] != repo:
              reasons.append("head is not in this repository")
          if pr["draft"]:
              reasons.append("draft")
          files = api(f"repos/{repo}/pulls/{number}/files?per_page=100")
          if not files or len(files) > 60:
              reasons.append(f"{len(files)} changed files")
          for f in files:
              name = f["filename"]
              if not META.match(name) or f["status"] not in ("modified", "added"):
                  reasons.append(f"{name}: not release metadata ({f['status']})"); continue
              if name.endswith("CHANGELOG.md"):
                  continue
              patch = f.get("patch")
              if patch is None:
                  reasons.append(f"{name}: no diff available"); continue
              rule = MANIFEST_LINE if name == ".release-please-manifest.json" else (
                  TEXT_LINE if name.endswith("version.txt") else VERSION_LINE)
              for line in patch.splitlines():
                  if line.startswith(("+", "-")) and not line.startswith(("+++", "---")) and not rule.match(line):
                      reasons.append(f"{name}: changes more than the version"); break
          if reasons:
              say(f"::warning::Release PR #{number} left for the owner: " + "; ".join(reasons))
              sys.exit(0)

          runs = [run for page in pages(f"repos/{repo}/commits/{sha}/check-runs?check_name={REQUIRED_CHECK}&per_page=100",
                                      os.environ["CHECKS_TOKEN"])
                  for run in page.get("check_runs", [])
                  if run.get("name") == REQUIRED_CHECK and (run.get("app") or {}).get("id") == ACTIONS_APP_ID]
          if not runs or any(run.get("status") != "completed" for run in runs):
              say(f"Release PR #{number} ({sha[:7]}): required check `{REQUIRED_CHECK}` not finished — "
                  "the CI workflow_run trigger merges it when CI completes.")
              sys.exit(0)
          latest = max(runs, key=lambda run: (run.get("completed_at") or "", run.get("id") or 0))
          if latest.get("conclusion") != "success":
              say(f"::warning::Release PR #{number} ({sha[:7]}): `{REQUIRED_CHECK}` is {latest.get('conclusion')} — left for the owner.")
              sys.exit(0)

          if os.environ.get("RELEASE_MODE") == "on-request":
              closed = json.loads(subprocess.run(
                  ["gh", "api", f"repos/{repo}/pulls?state=closed&base=main&sort=updated&direction=desc&per_page={CLOSED_PAGE}"],
                  capture_output=True, text=True, check=True).stdout)
              def contained(merge_sha):
                  # The head of the Release PR is ahead of (or equal to) the merge commit only if it contains it.
                  compared = subprocess.run(["gh", "api", "--jq", ".status", f"repos/{repo}/compare/{merge_sha}...{sha}"],
                                            capture_output=True, text=True)
                  return compared.returncode == 0 and compared.stdout.strip() in ("ahead", "identical")
              requested, reason = release_request(closed, repo, HEAD, contained)
              if not requested:
                  say(f"Release PR #{number} ({sha[:7]}) left for the owner (release-mode on-request): {reason}.")
                  sys.exit(0)
              say(f"Release requested: {reason}.")
          elif os.environ.get("RELEASE_MODE") != "always":
              say("::error::release-mode must be always or on-request")
              sys.exit(1)

          merged = subprocess.run(["gh", "api", "--method", "PUT", f"repos/{repo}/pulls/{number}/merge",
                                   "-f", "merge_method=squash", "-f", f"sha={sha}"],
                                  capture_output=True, text=True)
          if merged.returncode != 0:
              say(f"::error::Release PR #{number} ({sha[:7]}) merge refused: {merged.stderr.strip() or merged.stdout.strip()}")
              sys.exit(1)
          say(f"Release PR #{number} ({sha[:7]}): merged (squash) after `{REQUIRED_CHECK}` passed on that head.")
          PY
