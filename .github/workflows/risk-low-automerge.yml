# Merges (squash, directly) caller pull requests that satisfy the risk:low gate. No human approval
# is needed for them; a requested-changes review is the owner's veto. risk:high and unlabeled
# pull requests never qualify.
#
# The merge is pinned to the evaluated head SHA (the API refuses if the head moved). A new push
# to the PR requires a fresh gate run before it can merge.
#
# Callers pin this workflow by reviewed commit and pass gate-ref (verbanium-lab/.github script SHA)
# plus every policy knob through inputs. The AI review check name is an input (default ai-review);
# the check itself is produced elsewhere (engine-apps#26).
#
# Example caller — see docs/reusable-workflows.md#risk-low-auto-merge.

name: Risk low auto-merge

on:
  workflow_call:
    inputs:
      client-id:
        description: verbanium-ci App client ID (vars.VERBANIUM_CI_CLIENT_ID of the caller)
        required: true
        type: string
      gate-ref:
        description: >-
          40-character lowercase hex commit of verbanium-lab/.github that supplies
          risk_low_automerge.py (callers pin; bump when the gate script changes on main)
        required: true
        type: string
      pr-number:
        description: Pull request number to evaluate
        required: true
        type: string
      required-check:
        description: Required CI check name on the PR head (GitHub Actions app on the caller repo)
        default: ci
        type: string
      ai-review-check:
        description: Advisory AI reviewer check name that must succeed on the PR head
        default: ai-review
        type: string
      low-risk-label:
        description: Label that must be present
        default: risk:low
        type: string
      high-risk-label:
        description: Label that blocks auto-merge when present
        default: risk:high
        type: string
      protected-paths:
        description: >-
          Newline-separated extra globs merged with the gate script minimum set; callers cannot
          remove baked-in protected paths
        default: ""
        type: string
      allowed-authors:
        description: Comma-separated login|Type pairs allowed besides the configured agent bot id
        default: ""
        type: string
      agent-bot-id:
        description: Numeric GitHub user id of the allowed agent bot (empty denies all bots)
        default: ""
        type: string
      actions-app-id:
        description: GitHub App id for required CI check runs
        default: "15368"
        type: string
      ai-review-actions-app-id:
        description: GitHub App id for the AI review check (defaults to actions-app-id when empty)
        default: "15368"
        type: string
      base-branch:
        description: Pull request base branch that may auto-merge
        default: main
        type: string
    secrets:
      VERBANIUM_CI_PRIVATE_KEY:
        description: verbanium-ci App private key (organization secret)
        required: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
    environment:
      name: production
      deployment: false
    steps:
      - name: Validate inputs
        id: plan
        env:
          CLIENT_ID: ${{ inputs.client-id }}
          GATE_REF: ${{ inputs.gate-ref }}
          PR_NUMBER: ${{ inputs.pr-number }}
          REQUIRED_CHECK: ${{ inputs.required-check }}
          AI_REVIEW_CHECK: ${{ inputs.ai-review-check }}
          LOW_RISK_LABEL: ${{ inputs.low-risk-label }}
          HIGH_RISK_LABEL: ${{ inputs.high-risk-label }}
          PROTECTED_PATHS: ${{ inputs.protected-paths }}
          ALLOWED_AUTHORS: ${{ inputs.allowed-authors }}
          AGENT_BOT_ID: ${{ inputs.agent-bot-id }}
          ACTIONS_APP_ID: ${{ inputs.actions-app-id }}
          AI_REVIEW_ACTIONS_APP_ID: ${{ inputs.ai-review-actions-app-id }}
          BASE_BRANCH: ${{ inputs.base-branch }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::pr-number must be digits"; exit 1; }
          [[ "$GATE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::gate-ref must be a 40-character lowercase hex commit of verbanium-lab/.github"; exit 1; }
          [[ "$CLIENT_ID" =~ ^Iv[0-9A-Za-z.]{10,40}$ ]] || { echo "::error::invalid client-id"; exit 1; }
          [[ "$AGENT_BOT_ID" == "" || "$AGENT_BOT_ID" =~ ^[0-9]+$ ]] || { echo "::error::agent-bot-id must be digits or empty"; exit 1; }
          [[ "$ACTIONS_APP_ID" =~ ^[0-9]+$ ]] || { echo "::error::actions-app-id must be digits"; exit 1; }
          [[ "$AI_REVIEW_ACTIONS_APP_ID" =~ ^[0-9]+$ ]] || { echo "::error::ai-review-actions-app-id must be digits"; exit 1; }
          for line in client-id="$CLIENT_ID" gate-ref="$GATE_REF" pr-number="$PR_NUMBER" required-check="$REQUIRED_CHECK" ai-review-check="$AI_REVIEW_CHECK" low-risk-label="$LOW_RISK_LABEL" high-risk-label="$HIGH_RISK_LABEL" agent-bot-id="$AGENT_BOT_ID" actions-app-id="$ACTIONS_APP_ID" ai-review-actions-app-id="$AI_REVIEW_ACTIONS_APP_ID" base-branch="$BASE_BRANCH"; do
            val="${line#*=}"
            [[ "$val" != *$'\n'* && "$val" != *$'\r'* ]] || { echo "::error::workflow output value must not contain newlines: ${line%%=*}"; exit 1; }
          done
          {
            echo "client-id=$CLIENT_ID"
            echo "gate-ref=$GATE_REF"
            echo "pr-number=$PR_NUMBER"
            echo "required-check=$REQUIRED_CHECK"
            echo "ai-review-check=$AI_REVIEW_CHECK"
            echo "low-risk-label=$LOW_RISK_LABEL"
            echo "high-risk-label=$HIGH_RISK_LABEL"
            echo "agent-bot-id=$AGENT_BOT_ID"
            echo "actions-app-id=$ACTIONS_APP_ID"
            echo "ai-review-actions-app-id=$AI_REVIEW_ACTIONS_APP_ID"
            echo "base-branch=$BASE_BRANCH"
            echo "allowed-authors<<GATE_AUTHORS"
            printf '%s\n' "$ALLOWED_AUTHORS"
            echo GATE_AUTHORS
            echo "protected-paths<<GATE_PATHS"
            printf '%s\n' "$PROTECTED_PATHS"
            echo GATE_PATHS
          } >> "$GITHUB_OUTPUT"
      - name: Check out gate scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: verbanium-lab/.github
          ref: ${{ steps.plan.outputs.gate-ref }}
          path: _github-defaults
          persist-credentials: false
          sparse-checkout: .github/scripts/risk_low_automerge.py
      - name: Mint verbanium-ci token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.plan.outputs.client-id }}
          private-key: ${{ secrets.VERBANIUM_CI_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Evaluate pull request and enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CHECKS_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.plan.outputs.pr-number }}
          REQUIRED_CHECK: ${{ steps.plan.outputs.required-check }}
          AI_REVIEW_CHECK: ${{ steps.plan.outputs.ai-review-check }}
          LOW_RISK_LABEL: ${{ steps.plan.outputs.low-risk-label }}
          HIGH_RISK_LABEL: ${{ steps.plan.outputs.high-risk-label }}
          PROTECTED_PATHS: ${{ steps.plan.outputs.protected-paths }}
          ALLOWED_AUTHORS: ${{ steps.plan.outputs.allowed-authors }}
          AGENT_BOT_ID: ${{ steps.plan.outputs.agent-bot-id }}
          ACTIONS_APP_ID: ${{ steps.plan.outputs.actions-app-id }}
          AI_REVIEW_ACTIONS_APP_ID: ${{ steps.plan.outputs.ai-review-actions-app-id }}
          BASE_BRANCH: ${{ steps.plan.outputs.base-branch }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          sys.path.insert(0, "_github-defaults/.github/scripts")
          from risk_low_automerge import decide, neutralize_actions_log_text, parse_agent_bot_id
          from risk_low_automerge import parse_allowed_authors, parse_patterns, paths_from_pr_files
          from risk_low_automerge import pr_files_inventory_ok

          repo = os.environ["REPO"]
          number = os.environ["PR_NUMBER"]
          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a")

          def say(message):
              print(message)
              summary.write(message + "\n")

          def pages(path, token=None):
              env = dict(os.environ, GH_TOKEN=token) if token else None
              out = subprocess.run(
                  ["gh", "api", "--paginate", "--slurp", path],
                  capture_output=True,
                  text=True,
                  check=True,
                  env=env,
              ).stdout
              return json.loads(out)

          def api_items(path):
              return [item for page in pages(path) for item in page]

          pr = json.loads(
              subprocess.run(
                  ["gh", "api", f"repos/{repo}/pulls/{number}"],
                  capture_output=True,
                  text=True,
                  check=True,
              ).stdout
          )
          sha = pr["head"]["sha"]
          labels = api_items(f"repos/{repo}/issues/{number}/labels?per_page=100")
          label_names = {item["name"] for item in labels}
          files = api_items(f"repos/{repo}/pulls/{number}/files?per_page=100")
          changed_files_ok, changed_files_detail = pr_files_inventory_ok(
              file_count=pr.get("changed_files"),
              listed_count=len(files),
          )
          changed = paths_from_pr_files(files)
          check_pages = pages(
              f"repos/{repo}/commits/{sha}/check-runs?per_page=100",
              os.environ["CHECKS_TOKEN"],
          )
          check_runs = [run for page in check_pages for run in page.get("check_runs", [])]
          head_repo = (pr.get("head") or {}).get("repo") or {}
          author = pr.get("user") or {}
          agent_bot_id = parse_agent_bot_id(os.environ["AGENT_BOT_ID"])
          decision = decide(
              label_names=frozenset(label_names),
              draft=bool(pr.get("draft")),
              author_login=author.get("login", ""),
              author_type=author.get("type", ""),
              author_id=int(author.get("id") or 0),
              base_branch=os.environ["BASE_BRANCH"],
              pr_base=pr.get("base", {}).get("ref", ""),
              head_repo_full_name=head_repo.get("full_name", ""),
              caller_repo=repo,
              changed_files=tuple(changed),
              changed_files_ok=changed_files_ok,
              changed_files_detail=changed_files_detail,
              check_runs=tuple(check_runs),
              low_risk_label=os.environ["LOW_RISK_LABEL"],
              high_risk_label=os.environ["HIGH_RISK_LABEL"],
              protected_patterns=parse_patterns(os.environ["PROTECTED_PATHS"]),
              allowed_authors=parse_allowed_authors(os.environ["ALLOWED_AUTHORS"]),
              agent_bot_id=agent_bot_id,
              required_check=os.environ["REQUIRED_CHECK"],
              ai_review_check=os.environ["AI_REVIEW_CHECK"],
              actions_app_id=int(os.environ["ACTIONS_APP_ID"]),
              ai_review_actions_app_id=int(os.environ["AI_REVIEW_ACTIONS_APP_ID"]),
          )
          safe_reasons = "; ".join(neutralize_actions_log_text(r) for r in decision.reasons)
          if not decision.enable_auto_merge:
              say(
                  f"::notice::PR #{number} ({sha[:7]}): not merged by the gate — " + safe_reasons
              )
              sys.exit(0)
          # Human veto: a requested-changes review from anyone stops the gate.
          reviews = api_items(f"repos/{repo}/pulls/{number}/reviews?per_page=100")
          latest = {}
          for review in reviews:
              if review.get("state") in ("APPROVED", "CHANGES_REQUESTED", "DISMISSED"):
                  latest[(review.get("user") or {}).get("login", "")] = review["state"]
          if "CHANGES_REQUESTED" in latest.values():
              say(f"::notice::PR #{number} ({sha[:7]}): not merged — a review requests changes.")
              sys.exit(0)
          # GitHub auto-merge does not apply the App's ruleset bypass, so the gate merges
          # directly, pinned to the evaluated head (the API refuses if the head moved).
          merged = subprocess.run(
              ["gh", "api", "--method", "PUT", f"repos/{repo}/pulls/{number}/merge",
               "-f", "merge_method=squash", "-f", f"sha={sha}"],
              capture_output=True,
              text=True,
          )
          if merged.returncode != 0:
              detail = neutralize_actions_log_text(
                  (merged.stderr or merged.stdout or "").strip()
              )
              say(f"::error::PR #{number} ({sha[:7]}): merge refused: " + detail)
              sys.exit(1)
          say(f"PR #{number} ({sha[:7]}): merged (squash) after the risk:low gate passed on that head.")
          PY
